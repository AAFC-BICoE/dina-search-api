name: Java CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: 'nvd'
          server-password: NVD_API_KEY

      - name: Build with Maven
        run: mvn -q install
      - name: Run Checkstyle
        run: mvn -q checkstyle:check
      - name: Run SpotBugs
        run: mvn -q spotbugs:check
        
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache NVD Database (valid for 1 day)
        if: ${{ github.ref == 'refs/heads/dev' }}
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-nvd-cache-${{ steps.date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-nvd-cache-

      - name: Run OWASP dependency-check (only on dev)
        if: ${{ github.ref == 'refs/heads/dev' }}
        uses: dependency-check/Dependency-Check_Action@main
        id: search-api-dependency-check
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'test'
          path: '.'
          format: 'HTML'
          args: >
            --failOnCVSS 8
            --suppression owasp-suppression.xml

      - name: Extract Version
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          mvn help:evaluate -Dexpression=project.version -q -DforceStdout > version.txt
      - name: Store artifacts
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            version.txt
            search-ws/target/search-ws-*.jar
            search-ws/Dockerfile
            search-cli/target/search-cli-*.jar
            search-cli/Dockerfile
  push:
    name: Build Docker Image and Push to DockerHub
    needs: [build]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Download artifacts from build job
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts

      - name: Set VERSION_TAG ENV variable
        run: |
          echo "VERSION_TAG=$(cat version.txt)" >> $GITHUB_ENV
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        id: ws-builder
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        id: cli-builder

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build dina-search-ws Image and Push
        uses: docker/build-push-action@v3
        with:
          builder: ${{ steps.ws-builder.outputs.name }}
          context: search-ws/.
          push: true
          tags: aafcbicoe/dina-search-ws:${{ env.VERSION_TAG }}
          provenance: false

      - name: Build dina-search-cli Image and Push
        uses: docker/build-push-action@v3
        with:
          builder: ${{ steps.cli-builder.outputs.name }}
          context: search-cli/.
          push: true
          tags: aafcbicoe/dina-search-cli:${{ env.VERSION_TAG }}
          provenance: false
          # Force the builder engine to output standard Docker mediatypes for OKD
          outputs: type=image,oci-mediatypes=false
